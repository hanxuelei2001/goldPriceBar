name: Android Build

# Android 版的日常 CI：跑单元测试并产出可安装的 release APK。
# v* tag 的正式发布由 .github/workflows/release.yml 负责，这里不监听 tag，避免重复构建。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Android/**"
      - "scripts/android-setup.sh"
      - "scripts/build-android.sh"
      - "scripts/test-android.sh"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "Android/**"
      - "scripts/android-setup.sh"
      - "scripts/build-android.sh"
      - "scripts/test-android.sh"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # runner 在海外，官方源比国内镜像快
      GRADLE_CHINA_MIRRORS: "false"
      GRADLE_MIRROR: "https://services.gradle.org/distributions"
      ANDROID_SDK_MIRROR: "https://dl.google.com/android/repository"
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android@v3：它 action.yml 里的 packages 默认值是
      # "tools platform-tools"，而 tools 包已从 Google 的 SDK 仓库下线，sdkmanager 会
      # 直接以 "Failed to find package 'tools'" 退出 1。runner 镜像本身已带 ANDROID_HOME
      # 与 cmdline-tools，这里直接调用它补装组件即可。
      # scripts/build-android.sh 见到组件齐全就不再下载，只走已经装好的这套。
      - name: Install SDK packages
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "${sdkmanager}" ]; then
            sdkmanager="$(ls -d "${sdk_root}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ ! -x "${sdkmanager}" ]; then
            echo "::error::未找到 sdkmanager（ANDROID_HOME=${sdk_root}）"
            exit 1
          fi
          echo "sdkmanager: ${sdkmanager}"
          # 未接受的许可会让 sdkmanager 卡在交互提示上，先静默全部接受
          yes | "${sdkmanager}" --licenses > /dev/null 2>&1 || true
          "${sdkmanager}" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=${sdk_root}" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=${sdk_root}" >> "$GITHUB_ENV"
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: .gradle-home
          key: android-gradle-${{ hashFiles('Android/**/*.gradle.kts', 'Android/gradle/libs.versions.toml', 'Android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-gradle-

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p Android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > Android/keystore/release.jks
          echo "ANDROID_KEYSTORE_PATH=${GITHUB_WORKSPACE}/Android/keystore/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: bash scripts/test-android.sh

      - name: Assemble release APK
        run: bash scripts/build-android.sh release

      - name: List artifacts
        run: ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
